<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card login-card shadow-lg p-4">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                            <i class="bi bi-box-arrow-in-right fs-2"></i>

                        <h3>Welcome</h3>
                        <p>Admin login portal</p>
                    </div>

                    
                    <form action="loginadminPCode.php" method="POST">
                
                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Admin username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">
                                    <i class="bi bi-person-fill"></i>
                                </span>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="username" 
                                    name="username" 
                                    placeholder="Enter your username" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">
                                    <i class="bi bi-lock-fill"></i>
                                </span>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Enter your password" 
                                    required
                                >
                            </div>
                        </div>

                        
                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                        </button>
                    </form>
